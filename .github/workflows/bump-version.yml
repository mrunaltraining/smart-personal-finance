name: Auto Bump Version

on:
  push:
    branches: [main]

jobs:
  bump:
    # Skip if this commit was the version bump itself (prevents infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump build number and update documentation
        run: |
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bump version [skip ci]" -m "Auto-updated version and documentation using scripts/bump-version.sh"
          git push
